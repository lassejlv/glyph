6.5V5a1.25 1.25 0 0 1 1.25-1.25h2.5A1.25 1.25 0 0 1 14.5 5v1.5\"/>\u003cpath d=\"M6 6.5v12a1.75 1.75 0 0 0 1.75 1.75h8.5A1.75 1.75 0 0 0 18 18.5v-12\"/>\u003cpath d=\"M10 10.5v6M14 10.5v6\"/>\u003c/svg>","solid":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill-rule=\"evenodd\">\u003cpath d=\"M4 6.5h16M9.5 6.5V5a1.25 1.25 0 0 1 1.25-1.25h2.5A1.25 1.25 0 0 1 14.5 5v1.5Z\"/>\u003cpath d=\"M6 9h12v9.5a1.75 1.75 0 0 1-1.75 1.75h-8.5A1.75 1.75 0 0 1 6 18.5ZM8.5 11.5a1.5 1.5 0 0 1 3 0v5a1.5 1.5 0 0 1-3 0ZM12.5 11.5a1.5 1.5 0 0 1 3 0v5a1.5 1.5 0 0 1-3 0Z\"/>\u003c/svg>"},"user":{"outline":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"7.25\" r=\"3.5\"/>\u003cpath d=\"M4.75 19.25c0-3.3 3.25-5.25 7.25-5.25s7.25 1.95 7.25 5.25a1 1 0 0 1-1 1h-12.5a1 1 0 0 1-1-1Z\"/>\u003c/svg>","solid":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003ccircle cx=\"12\" cy=\"7.25\" r=\"4.25\"/>\u003cpath d=\"M4 19.25c0-3.6 3.6-6 8-6s8 2.4 8 6a1.75 1.75 0 0 1-1.75 1.75H5.75A1.75 1.75 0 0 1 4 19.25Z\"/>\u003c/svg>"},"x-mark":{"outline":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 6 12 12M18 6 6 18\"/>\u003c/svg>","solid":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 6 12 12M18 6 6 18\"/>\u003c/svg>"}};
const TAGS = {"arrow-right":["next","forward","continue","direction"],"bell":["notification","alert","alarm","reminder"],"bookmark":["save","favorite","read later","ribbon"],"calendar":["date","schedule","event","month","day"],"chat":["message","comment","conversation","bubble","talk"],"check":["done","success","confirm","tick","ok","complete"],"chevron-down":["expand","dropdown","open","caret","more"],"document":["file","page","paper","text","note"],"folder":["directory","files","collection","archive"],"heart":["like","love","favorite","health"],"home":["house","dashboard","start","main"],"lock":["secure","password","private","security","locked"],"mail":["email","envelope","inbox","message","letter"],"menu":["hamburger","navigation","bars","list","lines"],"minus":["remove","subtract","collapse","less"],"plus":["add","new","create","more","expand"],"search":["find","magnifier","lookup","zoom","magnifying glass"],"star":["favorite","rating","bookmark","featured"],"trash":["delete","remove","bin","garbage","discard"],"user":["person","profile","account","avatar","member","people"],"x-mark":["close","cancel","dismiss","remove","exit","cross"]};
const VARIANTS = ["outline","solid"];

const $ = (id) => document.getElementById(id);
const q = $("q"), grid = $("grid"), sizeInput = $("size");
const names = Object.keys(ICONS);
const camel = (s) => s.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase());

const params = new URLSearchParams(location.search);
let variant = VARIANTS.includes(params.get("style")) ? params.get("style") : VARIANTS[0];
q.value = params.get("q") || "";

const cards = new Map(names.map((name) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "card";
  btn.title = name;
  btn.innerHTML = ICONS[name][variant] + "<span></span>";
  btn.querySelector("span").textContent = name;
  btn.addEventListener("click", () => openIcon(name));
  grid.append(btn);
  return [name, btn];
}));

function matches(name, terms) {
  const hay = [name, ...(TAGS[name] || [])].join(" ").toLowerCase();
  return terms.every((t) => hay.includes(t));
}

function render() {
  const query = q.value.trim().toLowerCase();
  const terms = query.split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const [name, card] of cards) {
    const ok = matches(name, terms);
    card.hidden = !ok;
    if (ok) shown++;
  }
  $("meta").textContent = terms.length
    ? shown + " of " + names.length + " icons"
    : names.length + (names.length === 1 ? " icon" : " icons");
  $("empty").hidden = shown > 0;
  $("empty-q").textContent = "\u201c" + q.value.trim() + "\u201d";
  syncUrl();
}

function setVariant(v) {
  variant = v;
  for (const b of document.querySelectorAll("[data-variant]")) b.setAttribute("aria-pressed", String(b.dataset.variant === v));
  for (const [name, card] of cards) card.firstElementChild.outerHTML = ICONS[name][v];
  syncUrl();
}

function syncUrl() {
  const p = new URLSearchParams();
  if (q.value.trim()) p.set("q", q.value.trim());
  if (variant !== VARIANTS[0]) p.set("style", variant);
  const s = p.toString();
  history.replaceState(null, "", s ? "?" + s : location.pathname);
}

function setSize(px) {
  document.documentElement.style.setProperty("--size", px + "px");
  $("size-out").textContent = px + "px";
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast("Copied " + label);
}

function download(name, v) {
  const url = URL.createObjectURL(new Blob([ICONS[name][v] + "\n"], { type: "image/svg+xml" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name + (VARIANTS.length > 1 ? "-" + v : "") + ".svg" });
  a.click();
  URL.revokeObjectURL(url);
}

function openIcon(name) {
  $("dlg-title").textContent = name;
  const tagBox = $("dlg-tags");
  tagBox.replaceChildren(...(TAGS[name] || []).map((t) => Object.assign(document.createElement("span"), { textContent: t })));
  const box = $("dlg-variants");
  box.replaceChildren(...VARIANTS.map((v) => {
    const el = document.createElement("div");
    el.className = "variant";
    el.innerHTML = '<div class="stage">' + ICONS[name][v] + '</div><div class="bar"><b></b><button type="button" class="btn" data-act="copy">Copy SVG</button><button type="button" class="btn" data-act="dl">Download</button></div>';
    el.querySelector("b").textContent = v;
    el.querySelector('[data-act="copy"]').addEventListener("click", () => copy(ICONS[name][v], name + " (" + v + ")"));
    el.querySelector('[data-act="dl"]').addEventListener("click", () => download(name, v));
    return el;
  }));
  $("dlg-code").textContent = "import { " + VARIANTS.map((v) => camel(name + "-" + v)).join(", ") + ' } from "glyph";';
  $("dlg").showModal();
}

$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
for (const b of document.querySelectorAll("[data-variant]")) b.addEventListener("click", () => setVariant(b.dataset.variant));
q.addEventListener("input", render);
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; render(); } });
sizeInput.addEventListener("input", () => setSize(sizeInput.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q && !$("dlg").open) { e.preventDefault(); q.focus(); }
});

setSize(sizeInput.value);
setVariant(variant);
render();
</script>
