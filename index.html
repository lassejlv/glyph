<body>
<header class="wrap">
  <h1>Glyph</h1>
  <p class="lede">Clean SVG icons in outline and solid styles. Click an icon to copy or download it.</p>
</header>

<div class="toolbar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.25"/><path d="m15.75 15.75 4 4"/></svg>
      <input id="q" type="search" placeholder="Search icons" autocomplete="off" spellcheck="false" aria-label="Search icons">
      <kbd>/</kbd>
    </label>
    <div class="segmented" role="group" aria-label="Icon style">
      <button type="button" data-variant="outline" aria-pressed="false">outline</button><button type="button" data-variant="solid" aria-pressed="false">solid</button>
    </div>
    <label class="size">Size <input id="size" type="range" min="16" max="64" step="4" value="32"><output id="size-out">32px</output></label>
  </div>
</div>

<main class="wrap">
  <p class="meta" id="meta" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No icons match <strong id="empty-q"></strong></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div>
      <h2 id="dlg-title"></h2>
      <div class="tags" id="dlg-tags"></div>
    </div>
    <button type="button" class="icon-btn" id="dlg-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6.75 6.75 10.5 10.5m0-10.5-10.5 10.5"/></svg></button>
  </div>
  <div class="variants" id="dlg-variants"></div>
  <pre class="code" id="dlg-code"></pre>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const ICONS = {"user":{"outline":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"7.25\" r=\"3.5\"/>\u003cpath d=\"M4.75 19.25c0-3.3 3.25-5.25 7.25-5.25s7.25 1.95 7.25 5.25a1 1 0 0 1-1 1h-12.5a1 1 0 0 1-1-1Z\"/>\u003c/svg>","solid":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003ccircle cx=\"12\" cy=\"7.25\" r=\"4.25\"/>\u003cpath d=\"M4 19.25c0-3.6 3.6-6 8-6s8 2.4 8 6a1.75 1.75 0 0 1-1.75 1.75H5.75A1.75 1.75 0 0 1 4 19.25Z\"/>\u003c/svg>"}};
const TAGS = {"user":["person","profile","account","avatar","member","people"]};
const VARIANTS = ["outline","solid"];

const $ = (id) => document.getElementById(id);
const q = $("q"), grid = $("grid"), sizeInput = $("size");
const names = Object.keys(ICONS);
const camel = (s) => s.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase());

const params = new URLSearchParams(location.search);
let variant = VARIANTS.includes(params.get("style")) ? params.get("style") : VARIANTS[0];
q.value = params.get("q") || "";

const cards = new Map(names.map((name) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "card";
  btn.title = name;
  btn.innerHTML = ICONS[name][variant] + "<span></span>";
  btn.querySelector("span").textContent = name;
  btn.addEventListener("click", () => openIcon(name));
  grid.append(btn);
  return [name, btn];
}));

function matches(name, terms) {
  const hay = [name, ...(TAGS[name] || [])].join(" ").toLowerCase();
  return terms.every((t) => hay.includes(t));
}

function render() {
  const query = q.value.trim().toLowerCase();
  const terms = query.split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const [name, card] of cards) {
    const ok = matches(name, terms);
    card.hidden = !ok;
    if (ok) shown++;
  }
  $("meta").textContent = terms.length
    ? shown + " of " + names.length + " icons"
    : names.length + (names.length === 1 ? " icon" : " icons");
  $("empty").hidden = shown > 0;
  $("empty-q").textContent = "\u201c" + q.value.trim() + "\u201d";
  syncUrl();
}

function setVariant(v) {
  variant = v;
  for (const b of document.querySelectorAll("[data-variant]")) b.setAttribute("aria-pressed", String(b.dataset.variant === v));
  for (const [name, card] of cards) card.firstElementChild.outerHTML = ICONS[name][v];
  syncUrl();
}

function syncUrl() {
  const p = new URLSearchParams();
  if (q.value.trim()) p.set("q", q.value.trim());
  if (variant !== VARIANTS[0]) p.set("style", variant);
  const s = p.toString();
  history.replaceState(null, "", s ? "?" + s : location.pathname);
}

function setSize(px) {
  document.documentElement.style.setProperty("--size", px + "px");
  $("size-out").textContent = px + "px";
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast("Copied " + label);
}

function download(name, v) {
  const url = URL.createObjectURL(new Blob([ICONS[name][v] + "\n"], { type: "image/svg+xml" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name + (VARIANTS.length > 1 ? "-" + v : "") + ".svg" });
  a.click();
  URL.revokeObjectURL(url);
}

function openIcon(name) {
  $("dlg-title").textContent = name;
  const tagBox = $("dlg-tags");
  tagBox.replaceChildren(...(TAGS[name] || []).map((t) => Object.assign(document.createElement("span"), { textContent: t })));
  const box = $("dlg-variants");
  box.replaceChildren(...VARIANTS.map((v) => {
    const el = document.createElement("div");
    el.className = "variant";
    el.innerHTML = '<div class="stage">' + ICONS[name][v] + '</div><div class="bar"><b></b><button type="button" class="btn" data-act="copy">Copy SVG</button><button type="button" class="btn" data-act="dl">Download</button></div>';
    el.querySelector("b").textContent = v;
    el.querySelector('[data-act="copy"]').addEventListener("click", () => copy(ICONS[name][v], name + " (" + v + ")"));
    el.querySelector('[data-act="dl"]').addEventListener("click", () => download(name, v));
    return el;
  }));
  $("dlg-code").textContent = "import { " + VARIANTS.map((v) => camel(name + "-" + v)).join(", ") + ' } from "glyph";';
  $("dlg").showModal();
}

$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
for (const b of document.querySelectorAll("[data-variant]")) b.addEventListener("click", () => setVariant(b.dataset.variant));
q.addEventListener("input", render);
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; render(); } });
sizeInput.addEventListener("input", () => setSize(sizeInput.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q && !$("dlg").open) { e.preventDefault(); q.focus(); }
});

setSize(sizeInput.value);
setVariant(variant);
render();
</script>
</body>
</html>
