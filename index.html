const BRAND_TAGS = {"anthropic":["ai","claude","llm"],"apple":["mac","macos","ios","iphone"],"claude":["ai","anthropic","assistant","chatbot","llm"],"discord":["chat","community","voice","server"],"figma":["design","prototype","ui"],"github":["git","code","repository","octocat"],"gitlab":["git","code","repository","devops"],"google":["search"],"linear":["issues","tracker","project management"],"notion":["notes","docs","wiki"],"npm":["package","registry","node","javascript"],"stripe":["payments","billing","checkout"],"vercel":["deploy","hosting","nextjs"],"x":["twitter","tweet","social"]};

const $ = (id) => document.getElementById(id);
const q = $("q"), sizeInput = $("size");
const names = Object.keys(ICONS);
const brandNames = Object.keys(BRANDS);
const camel = (s) => s.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase());

const params = new URLSearchParams(location.search);
let variant = VARIANTS.includes(params.get("style")) ? params.get("style") : VARIANTS[0];
q.value = params.get("q") || "";

function card(name, svg, grid, open) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "card";
  btn.title = name;
  btn.innerHTML = svg + "<span></span>";
  btn.querySelector("span").textContent = name;
  btn.addEventListener("click", open);
  grid.append(btn);
  return [name, btn];
}

const cards = new Map(names.map((name) => card(name, ICONS[name][variant], $("grid"), () => openIcon(name))));
const brandCards = new Map(brandNames.map((name) => card(name, BRANDS[name], $("brand-grid"), () => openBrand(name))));

function matches(name, tags, terms) {
  const hay = [name, ...(tags[name] || [])].join(" ").toLowerCase();
  return terms.every((t) => hay.includes(t));
}

function filter(cardMap, tags, terms) {
  let shown = 0;
  for (const [name, card] of cardMap) {
    const ok = matches(name, tags, terms);
    card.hidden = !ok;
    if (ok) shown++;
  }
  return shown;
}

function render() {
  const query = q.value.trim().toLowerCase();
  const terms = query.split(/\s+/).filter(Boolean);
  const shown = filter(cards, TAGS, terms);
  const shownBrands = filter(brandCards, BRAND_TAGS, terms);
  $("icons-section").hidden = shown === 0;
  $("brands-section").hidden = shownBrands === 0;
  if (!brandNames.length) {
    $("meta").textContent = terms.length
      ? shown + " of " + names.length + " icons"
      : names.length + (names.length === 1 ? " icon" : " icons");
  } else {
    $("meta").textContent = terms.length
      ? shown + " of " + names.length + " icons \u00b7 " + shownBrands + " of " + brandNames.length + " brands"
      : names.length + (names.length === 1 ? " icon" : " icons") + " \u00b7 " + brandNames.length + (brandNames.length === 1 ? " brand" : " brands");
  }
  $("empty").hidden = shown + shownBrands > 0;
  $("empty-q").textContent = "\u201c" + q.value.trim() + "\u201d";
  syncUrl();
}

function setVariant(v) {
  variant = v;
  for (const b of document.querySelectorAll("[data-variant]")) b.setAttribute("aria-pressed", String(b.dataset.variant === v));
  for (const [name, card] of cards) card.firstElementChild.outerHTML = ICONS[name][v];
  syncUrl();
}

function syncUrl() {
  const p = new URLSearchParams();
  if (q.value.trim()) p.set("q", q.value.trim());
  if (variant !== VARIANTS[0]) p.set("style", variant);
  const s = p.toString();
  history.replaceState(null, "", s ? "?" + s : location.pathname);
}

function setSize(px) {
  document.documentElement.style.setProperty("--size", px + "px");
  $("size-out").textContent = px + "px";
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast("Copied " + label);
}

function download(svg, file) {
  const url = URL.createObjectURL(new Blob([svg + "\n"], { type: "image/svg+xml" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: file });
  a.click();
  URL.revokeObjectURL(url);
}

// panels: [{ label, svg, file, copyLabel }]
function openDialog(name, tags, panels, importLine) {
  $("dlg-title").textContent = name;
  const tagBox = $("dlg-tags");
  tagBox.replaceChildren(...(tags || []).map((t) => Object.assign(document.createElement("span"), { textContent: t })));
  const box = $("dlg-variants");
  box.replaceChildren(...panels.map((p) => {
    const el = document.createElement("div");
    el.className = "variant";
    el.innerHTML = '<div class="stage">' + p.svg + '</div><div class="bar"><b></b><button type="button" class="btn" data-act="copy">Copy SVG</button><button type="button" class="btn" data-act="dl">Download</button></div>';
    el.querySelector("b").textContent = p.label;
    el.querySelector('[data-act="copy"]').addEventListener("click", () => copy(p.svg, p.copyLabel));
    el.querySelector('[data-act="dl"]').addEventListener("click", () => download(p.svg, p.file));
    return el;
  }));
  $("dlg-code").textContent = importLine;
  $("dlg").showModal();
}

function openIcon(name) {
  openDialog(name, TAGS[name], VARIANTS.map((v) => ({
    label: v,
    svg: ICONS[name][v],
    file: name + (VARIANTS.length > 1 ? "-" + v : "") + ".svg",
    copyLabel: name + " (" + v + ")",
  })), "import { " + VARIANTS.map((v) => camel(name + "-" + v)).join(", ") + ' } from "glyph";');
}

function openBrand(name) {
  openDialog(name, BRAND_TAGS[name], [{ label: "brand", svg: BRANDS[name], file: name + ".svg", copyLabel: name }],
    "import { " + camel(name) + 'Brand } from "glyph";');
}

$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
for (const b of document.querySelectorAll("[data-variant]")) b.addEventListener("click", () => setVariant(b.dataset.variant));
q.addEventListener("input", render);
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; render(); } });
sizeInput.addEventListener("input", () => setSize(sizeInput.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q && !$("dlg").open) { e.preventDefault(); q.focus(); }
});

setSize(sizeInput.value);
setVariant(variant);
render();
</script>
